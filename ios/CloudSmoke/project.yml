name: ZYRON
options:
  bundleIdPrefix: com.zyron
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  ZYRON:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyron.ZYRON
        GENERATE_INFOPLIST_FILE: YES

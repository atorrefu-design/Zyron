name: iOS

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyron-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-for-testing:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project ios/ZYRON.xcodeproj
          -scheme ZYRON
          -resolvePackageDependencies

      - name: Compile app and tests for Simulator
        run: >-
          set -o pipefail &&
          xcodebuild
          -project ios/ZYRON.xcodeproj
          -scheme ZYRON
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/zyron-derived-data-simulator
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
          | xcbeautify

      - name: Build unsigned app for physical iPhone
        run: >-
          set -o pipefail &&
          xcodebuild
          -project ios/ZYRON.xcodeproj
          -scheme ZYRON
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath /tmp/zyron-derived-data-device
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
          | xcbeautify

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="/tmp/zyron-derived-data-device/Build/Products/Debug-iphoneos/ZYRON.app"
          test -d "$APP"
          rm -rf /tmp/zyron-payload
          mkdir -p /tmp/zyron-payload/Payload
          cp -R "$APP" /tmp/zyron-payload/Payload/ZYRON.app
          cd /tmp/zyron-payload
          zip -qry "$GITHUB_WORKSPACE/ZYRON-unsigned.ipa" Payload

      - name: Upload unsigned iPhone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZYRON-unsigned-iphone
          path: ZYRON-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
